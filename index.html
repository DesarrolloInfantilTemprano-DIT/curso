        attribution: 'Tiles &copy; Esri'
      });

      const callejeroOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      });

      // Añadir la vista satelital estilo Google Earth por defecto
      googleSat.addTo(map);

      const baseMaps = {
        "Google Satellite HD (Casas)": googleSat,
        "Esri World Imagery": esriClarity,
        "Callejero OSM": callejeroOSM
      };
      L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

      // CAPA Y HERRAMIENTAS DE DIBUJO (LEAFLET DRAW)
      map.addLayer(drawnItems);
      map.addLayer(markersLayer);

      const drawControl = new L.Control.Draw({
        position: 'topleft',
        draw: {
          polygon: {
            allowIntersection: false,
            drawError: { color: '#e11d48', timeout: 1000 },
            shapeOptions: { color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.35, weight: 3 }
          },
          rectangle: {
            shapeOptions: { color: '#059669', fillColor: '#10b981', fillOpacity: 0.35, weight: 3 }
          },
          circle: false,
          polyline: false,
          circlemarker: false,
          marker: false
        },
        edit: {
          featureGroup: drawnItems,
          remove: true
        }
      });
      map.addControl(drawControl);

      // Eventos de Dibujo de Polígonos
      map.on(L.Draw.Event.CREATED, function (e) {
        drawnItems.clearLayers();
        activePolygonLayer = e.layer;
        drawnItems.addLayer(activePolygonLayer);
        document.getElementById('containerBorrarTrazo').classList.remove('hidden');
        aplicarFiltros();
      });

      map.on(L.Draw.Event.DELETED, function () {
        activePolygonLayer = null;
        document.getElementById('containerBorrarTrazo').classList.add('hidden');
        aplicarFiltros();
      });

      cargarBaseDatos();
    }

    async function cargarBaseDatos() {
      actualizarBadge("Cargando...", true);
      
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000);

        const response = await fetch(`${URL_CENSO}?action=obtenerTodosMapas`, {
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const result = await response.json();

        if (result && result.status === "ok" && Array.isArray(result.data) && result.data.length > 0) {
          baseDatos = result.data;
        } else {
          baseDatos = MOCK_DATA;
        }
      } catch (error) {
        console.warn("Conexión con endpoint fallida, usando backup demo:", error);
        baseDatos = MOCK_DATA;
      }

      aplicarFiltros();
    }

    function actualizarBadge(texto) {
      const txtElem = document.getElementById('textoBadge');
      if (txtElem) txtElem.textContent = texto;
    }

    function parseFechaPeruana(strFecha) {
      if (!strFecha) return null;
      if (strFecha.includes('-')) {
        const partes = strFecha.split('-');
        if (partes[0].length === 4) return new Date(partes[0], partes[1] - 1, partes[2]);
      }
      const partes = strFecha.split('/');
      if (partes.length === 3) {
        return new Date(partes[2], partes[1] - 1, partes[0]);
      }
      return null;
    }

    function calcularEdad(fnStr) {
      const fechaNac = parseFechaPeruana(fnStr);
      if (!fechaNac) return null;
      const hoy = new Date();
      let edad = hoy.getFullYear() - fechaNac.getFullYear();
      const m = hoy.getMonth() - fechaNac.getMonth();
      if (m < 0 || (m === 0 && hoy.getDate() < fechaNac.getDate())) {
        edad--;
      }
      return edad;
    }

    function obtenerGrupoEtario(edad) {
      if (edad === null || isNaN(edad)) return 'Desconocido';
      if (edad < 12) return 'Niño';
      if (edad >= 12 && edad <= 17) return 'Adolescente';
      if (edad >= 18 && edad <= 29) return 'Joven';
      if (edad >= 30 && edad <= 59) return 'Adulto';
      return 'Anciano';
    }

    function aplicarFiltros() {
      const ffamiliar = document.getElementById('f_ffamiliar').value.trim().toLowerCase();
      const sector = document.getElementById('f_sector').value.trim().toLowerCase();
      const mz = document.getElementById('f_mz').value.trim().toLowerCase();
      const dni = document.getElementById('f_dni').value.trim().toLowerCase();
      const nombre = document.getElementById('f_nombre').value.trim().toLowerCase();

      const fnDesdeStr = document.getElementById('f_fn_desde').value;
      const fnHastaStr = document.getElementById('f_fn_hasta').value;

      const dateDesde = fnDesdeStr ? new Date(fnDesdeStr) : null;
      const dateHasta = fnHastaStr ? new Date(fnHastaStr) : null;

      markersLayer.clearLayers();

      // Preparar Polígono para Turf.js si existe un dibujo activo
      let turfPolygon = null;
      if (activePolygonLayer) {
        const geojson = activePolygonLayer.toGeoJSON();
        turfPolygon = geojson.geometry;
      }

      // Conteo Demográfico
      const stats = { ninos: 0, adolescentes: 0, jovenes: 0, adultos: 0, ancianos: 0, total: 0 };

      const filtrados = baseDatos.filter(item => {
        if (ffamiliar && (!item.ffamiliar || !item.ffamiliar.toString().toLowerCase().includes(ffamiliar))) return false;
        if (sector && (!item.sector || !item.sector.toString().toLowerCase().includes(sector))) return false;
        
        // REGLA SOLICITADA: BÚSQUEDA EXACTA DE MANZANA (MZ)
        if (mz) {
          const itemMz = item.mz ? item.mz.toString().trim().toLowerCase() : "";
          if (itemMz !== mz) return false;
        }

        if (dni && (!item.dni || !item.dni.toString().toLowerCase().includes(dni))) return false;
        if (nombre && (!item.nombreB || !item.nombreB.toString().toLowerCase().includes(nombre))) return false;

        if (dateDesde || dateHasta) {
          const fnFecha = parseFechaPeruana(item.fn);
          if (!fnFecha) return false;
          if (dateDesde && fnFecha < dateDesde) return false;
          if (dateHasta && fnFecha > dateHasta) return false;
        }

        // REGLA SOLICITADA: FILTRO POR DIBUJO EN EL MAPA (POLÍGONO/TRAZO)
        if (turfPolygon && item.georeferencia) {
          const coords = item.georeferencia.split(',');
          if (coords.length === 2) {
            const lat = parseFloat(coords[0].trim());
            const lng = parseFloat(coords[1].trim());
            if (!isNaN(lat) && !isNaN(lng)) {
              const pt = turf.point([lng, lat]); // Turf usa [lng, lat]
              const inside = turf.booleanPointInPolygon(pt, turfPolygon);
              if (!inside) return false;
            } else {
              return false;
            }
          } else {
            return false;
          }
        }

        // Acumular estadísticas
        const edad = calcularEdad(item.fn);
        const grupo = obtenerGrupoEtario(edad);
        if (grupo === 'Niño') stats.ninos++;
        else if (grupo === 'Adolescente') stats.adolescentes++;
        else if (grupo === 'Joven') stats.jovenes++;
        else if (grupo === 'Adulto') stats.adultos++;
        else if (grupo === 'Anciano') stats.ancianos++;
        stats.total++;

        return true;
      });

      // Actualizar Widget Estadístico Lateral
      document.getElementById('statNinos').textContent = stats.ninos;
      document.getElementById('statAdolescentes').textContent = stats.adolescentes;
      document.getElementById('statJovenes').textContent = stats.jovenes;
      document.getElementById('statAdultos').textContent = stats.adultos;
      document.getElementById('statAncianos').textContent = stats.ancianos;
      document.getElementById('statTotal').textContent = `${stats.total} pers.`;

      actualizarBadge(`${filtrados.length} Persona(s) Encontrada(s)`);

      const gruposCoordenadas = {};

      filtrados.forEach(item => {
        if (!item.georeferencia) return;
        const coords = item.georeferencia.split(',');
        if (coords.length === 2) {
          const lat = parseFloat(coords[0].trim());
          const lng = parseFloat(coords[1].trim());

          if (!isNaN(lat) && !isNaN(lng)) {
            const key = `${lat.toFixed(6)},${lng.toFixed(6)}`;
            if (!gruposCoordenadas[key]) {
              gruposCoordenadas[key] = { lat, lng, ffamiliar: item.ffamiliar, integrantes: [] };
            }
            gruposCoordenadas[key].integrantes.push(item);
          }
        }
      });

      const bounds = [];

      Object.values(gruposCoordenadas).forEach(grupo => {
        bounds.push([grupo.lat, grupo.lng]);

        // Estadísticas de esta familia específica
        const famStats = { ninos: 0, adolescentes: 0, jovenes: 0, adultos: 0, ancianos: 0 };
        grupo.integrantes.forEach(i => {
          const ed = calcularEdad(i.fn);
          const grp = obtenerGrupoEtario(ed);
          if (grp === 'Niño') famStats.ninos++;
          else if (grp === 'Adolescente') famStats.adolescentes++;
          else if (grp === 'Joven') famStats.jovenes++;
          else if (grp === 'Adulto') famStats.adultos++;
          else if (grp === 'Anciano') famStats.ancianos++;
        });

        let popupContent = `
          <div class="font-sans w-80 text-xs">
            <!-- CABECERA DE LA FICHA -->
            <div class="bg-blue-900 text-white p-3 font-bold flex justify-between items-center shadow-md">
              <div class="flex items-center gap-1.5">
                <i data-lucide="home" class="w-4 h-4 text-emerald-400"></i>
                <span>Ficha: ${grupo.ffamiliar || 'S/N'}</span>
              </div>
              <span class="text-[10px] bg-blue-950 px-2 py-0.5 rounded-full text-emerald-300 border border-emerald-500/30 font-semibold">
                ${grupo.integrantes.length} integrante(s)
              </span>
            </div>
            
            <div class="p-3 bg-white space-y-2.5">
              <!-- DIRECCIÓN Y SECTOR -->
              <div class="bg-slate-50 p-2 rounded-lg border border-slate-200">
                <p class="text-[11px] font-semibold text-slate-700 leading-snug">
                  <strong class="text-blue-900 uppercase">Sector:</strong> ${grupo.integrantes[0].sector || '-'}
                </p>
                <p class="text-[11px] font-semibold text-slate-700 leading-snug">
                  <strong class="text-blue-900 uppercase">Ref / Mz:</strong> ${grupo.integrantes[0].ref_direccion || '-'} (Mz ${grupo.integrantes[0].mz || '-'})
                </p>
              </div>

              <!-- RESUMEN DEMOGRÁFICO DE LA FAMILIA -->
              <div class="bg-blue-50/70 p-2 rounded-lg border border-blue-100 flex justify-between text-[10px] text-blue-950 font-bold">
                <span>🚸 Niños: ${famStats.ninos}</span>
                <span>🎒 Adolesc: ${famStats.adolescentes}</span>
                <span>🎓 Jóvenes: ${famStats.jovenes}</span>
                <span>💼 Adultos: ${famStats.adultos}</span>
                <span>👵 Ancianos: ${famStats.ancianos}</span>
              </div>

              <!-- LISTA DE INTEGRANTES CON WHATSAPP Y LLAMADAS -->
              <div class="border-t border-slate-100 pt-2 space-y-2 max-h-52 overflow-y-auto custom-scrollbar pr-1">
        `;

        grupo.integrantes.forEach((ing, idx) => {
          const edadIng = calcularEdad(ing.fn);
          const grupoEtario = obtenerGrupoEtario(edadIng);
          const telSanitized = ing.telefono ? ing.telefono.toString().replace(/\D/g, '') : '';

          popupContent += `
            <div class="bg-slate-50 hover:bg-blue-50/50 transition p-2 rounded-lg border border-slate-200 text-[11px] space-y-1">
              <div class="flex items-center justify-between font-bold text-blue-950">
                <span class="uppercase truncate max-w-[180px]">${ing.nombreB || 'SIN NOMBRE'}</span>
                <span class="text-[9px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded">${grupoEtario} (${edadIng !== null ? edadIng + 'a' : '-'})</span>
              </div>

              <div class="grid grid-cols-2 gap-x-1 text-[10px] text-slate-600">
                <p><strong>DNI:</strong> ${ing.dni || '-'}</p>
                <p><strong>F.Nac:</strong> ${ing.fn || '-'}</p>
                <p><strong>HC:</strong> ${ing.hclinica || '-'}</p>
                <p><strong>Tel:</strong> ${ing.telefono || '-'}</p>
              </div>

              <!-- ACCIONES WHATSAPP Y LLAMADA DIRECTA -->
              ${telSanitized.length >= 9 ? `
                <div class="flex items-center gap-1.5 pt-1 border-t border-slate-200/60 mt-1">
                  <a href="https://wa.me/51${telSanitized}?text=Estimado(a)%20${encodeURIComponent(ing.nombreB || '')}%20le%20escribimos%20del%20sistema%20SIGIS_FED" 
                    target="_blank" rel="noopener noreferrer"
                    class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold py-1 px-2 rounded-md flex items-center justify-center gap-1 transition">
                    <i data-lucide="message-circle" class="w-3 h-3"></i> WhatsApp
                  </a>
                  <a href="tel:${telSanitized}" 
                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-[10px] font-bold py-1 px-2 rounded-md flex items-center justify-center gap-1 transition">
                    <i data-lucide="phone" class="w-3 h-3"></i> Llamar
                  </a>
                </div>
              ` : `
                <span class="text-[9px] text-slate-400 italic block">Sin número registrado</span>
              `}
            </div>
          `;
        });

        popupContent += `
              </div>
            </div>
          </div>
        `;

        const marker = L.marker([grupo.lat, grupo.lng]).bindPopup(popupContent);
        marker.on('click', () => {
          setTimeout(() => lucide.createIcons(), 50);
        });
        markersLayer.addLayer(marker);
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
      }
    }

    function abrirModalSector() {
      renderizarListaModalSector(sectoresMaster);
      document.getElementById('modalSector').classList.remove('hidden');
      setTimeout(() => document.getElementById('inputBuscarSectorModal').focus(), 100);
    }

    function cerrarModalSector() {
      document.getElementById('modalSector').classList.add('hidden');
      document.getElementById('inputBuscarSectorModal').value = "";
    }

    function renderizarListaModalSector(lista) {
      const cont = document.getElementById('listaSectoresModal');
      cont.innerHTML = "";

      if (lista.length === 0) {
        cont.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">No se encontraron sectores</div>`;
        return;
      }

      lista.forEach(sec => {
        const item = document.createElement('div');
        item.className = "p-3 hover:bg-indigo-50/80 cursor-pointer transition flex justify-between items-center text-xs font-semibold text-slate-700 rounded-lg";
        item.innerHTML = `
          <span>${sec}</span>
          <i data-lucide="chevron-right" class="w-4 h-4 text-indigo-400"></i>
        `;
        item.onclick = () => {
          document.getElementById('f_sector').value = sec;
          cerrarModalSector();
          aplicarFiltros();
        };
        cont.appendChild(item);
      });
      lucide.createIcons();
    }

    function filtrarListaModalSector() {
      const query = document.getElementById('inputBuscarSectorModal').value.toLowerCase().trim();
      const filtrados = sectoresMaster.filter(s => s.toLowerCase().includes(query));
      renderizarListaModalSector(filtrados);
    }

    function limpiarFiltros() {
      document.getElementById('f_ffamiliar').value = "";
      document.getElementById('f_sector').value = "";
      document.getElementById('f_mz').value = "";
      document.getElementById('f_dni').value = "";
      document.getElementById('f_nombre').value = "";
      document.getElementById('f_fn_desde').value = "";
      document.getElementById('f_fn_hasta').value = "";
      limpiarDibujoMapa();
      aplicarFiltros();
    }

    function limpiarDibujoMapa() {
      drawnItems.clearLayers();
      activePolygonLayer = null;
      document.getElementById('containerBorrarTrazo').classList.add('hidden');
      aplicarFiltros();
    }

    function toggleMobileSidebar() {
      const sidebar = document.getElementById('sidebarFiltros');
      sidebar.classList.toggle('hidden');
    }

    window.onload = initMap;
  </script>
</body>
</html>
